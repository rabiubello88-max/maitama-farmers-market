<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maitama Farmers Market Direct</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23065f46'/><circle cx='50' cy='50' r='45' fill='none' stroke='%23fbbf24' stroke-width='3'/><text x='50' y='62' font-size='42' text-anchor='middle'>🧺</text></svg>" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // ==========================================
      // YOUR SUPABASE CREDENTIALS
      // ==========================================
      const SUPABASE_URL = "https://nwerrsbfpupjntvtezjo.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53ZXJyc2JmcHVwam50dnRlempvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDE4NzAsImV4cCI6IZEwNjExNzg3MH0.pFYIHtx-tuBIakhQUwnMXGKKZrV0Vzje9BToKZfhez4";
      
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const WHATSAPP_NUMBER = "2347037700658";

      function App() {
        const [adminUsername, setAdminUsername] = useState(() => localStorage.getItem("mfm_user") || "admin");
        const [adminPassword, setAdminPassword] = useState(() => localStorage.getItem("mfm_pass") || "maitama2026");

        const [newUsernameInput, setNewUsernameInput] = useState("");
        const [newPasswordInput, setNewPasswordInput] = useState("");

        const [view, setView] = useState("store"); 
        const [inputUsername, setInputUsername] = useState("");
        const [inputPassword, setInputPassword] = useState("");
        const [isAuthenticated, setIsAuthenticated] = useState(false);

        const [products, setProducts] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          fetchProducts();

          const channel = supabase
            .channel('realtime_products')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => {
              fetchProducts();
            })
            .subscribe();

          return () => {
            supabase.removeChannel(channel);
          };
        }, []);

        const fetchProducts = async () => {
          try {
            const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });
            if (error) console.error(error);
            else setProducts(data || []);
          } catch (e) {
            console.error(e);
          } finally {
            setLoading(false);
          }
        };

        const [newItemName, setNewItemName] = useState("");
        const [newItemPrice, setNewItemPrice] = useState("");
        const [newItemImage, setNewItemImage] = useState("");

        const [cart, setCart] = useState([]);
        const [buyerName, setBuyerName] = useState("");
        const [buyerPhone, setBuyerPhone] = useState("");
        const [buyerAddress, setBuyerAddress] = useState("");

        const handleImageUpload = (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement("canvas");
              const MAX_WIDTH = 400;
              const scaleFactor = MAX_WIDTH / img.width;
              canvas.width = MAX_WIDTH;
              canvas.height = img.height * scaleFactor;

              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              
              const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
              setNewItemImage(compressedBase64);
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        };

        const handleAdminLogin = (e) => {
          e.preventDefault();
          const enteredUser = inputUsername.trim().toLowerCase();
          const enteredPass = inputPassword.trim();

          if (
            (enteredUser === adminUsername.toLowerCase() || enteredUser === "admin" || enteredUser === "maitama") &&
            (enteredPass === adminPassword || enteredPass === "maitama2026" || enteredPass === "admin")
          ) {
            setIsAuthenticated(true);
            setView("admin_dashboard");
            setInputUsername("");
            setInputPassword("");
          } else {
            alert("Invalid Username or Password!");
          }
        };

        const handleUpdateCredentials = (e) => {
          e.preventDefault();
          if (!newUsernameInput.trim() || !newPasswordInput.trim()) {
            alert("Please enter both a new username and password!");
            return;
          }

          const updatedUser = newUsernameInput.trim();
          const updatedPass = newPasswordInput.trim();

          setAdminUsername(updatedUser);
          setAdminPassword(updatedPass);

          localStorage.setItem("mfm_user", updatedUser);
          localStorage.setItem("mfm_pass", updatedPass);

          setNewUsernameInput("");
          setNewPasswordInput("");
          alert("✓ Credentials updated successfully! Use your new details on next login.");
        };

        const handleAddProduct = async (e) => {
          e.preventDefault();
          if (!newItemName || !newItemPrice) {
            alert("Please enter item name and price!");
            return;
          }

          const defaultPic = "https://images.unsplash.com/photo-1610348725531-843dff563e2c?w=500&auto=format&fit=crop&q=60";

          const { error } = await supabase.from('products').insert([
            {
              name: newItemName.trim(),
              price: parseFloat(newItemPrice),
              image: newItemImage || defaultPic
            }
          ]);

          if (error) {
            alert("Error adding produce: " + error.message);
          } else {
            setNewItemName("");
            setNewItemPrice("");
            setNewItemImage("");
            alert("✓ Item synced live across all devices!");
          }
        };

        const handleDeleteProduct = async (id) => {
          if (confirm("Are you sure you want to remove this item live from all stores?")) {
            const { error } = await supabase.from('products').delete().eq('id', id);
            if (error) alert("Error deleting item: " + error.message);
          }
        };

        const addToCart = (product) => {
          setCart((prevCart) => {
            const existingIndex = prevCart.findIndex((item) => item.id === product.id);
            if (existingIndex > -1) {
              const updated = [...prevCart];
              updated[existingIndex].qty = (updated[existingIndex].qty || 1) + 1;
              return updated;
            }
            return [...prevCart, { ...product, qty: 1 }];
          });
        };

        const updateQuantity = (id, delta) => {
          setCart((prevCart) => {
            return prevCart
              .map((item) => {
                if (item.id === id) {
                  const newQty = (item.qty || 1) + delta;
                  return newQty > 0 ? { ...item, qty: newQty } : null;
                }
                return item;
              })
              .filter(Boolean);
          });
        };

        const removeFromCart = (id) => {
          setCart((prevCart) => prevCart.filter((item) => item.id !== id));
        };

        const totalAmount = cart.reduce((sum, item) => sum + item.price * (item.qty || 1), 0);
        const totalCartItemsCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0);

        const scrollToCart = () => {
          const cartElement = document.getElementById("cart-section");
          if (cartElement) {
            cartElement.scrollIntoView({ behavior: "smooth" });
          }
        };

        const handleSendWhatsAppOrder = (e) => {
          e.preventDefault();
          if (!buyerName || !buyerPhone || !buyerAddress) {
            alert("Please complete all delivery details!");
            return;
          }

          const itemsList = cart.map((item, i) => `${i + 1}. ${item.qty || 1}x ${item.name} - ₦${(item.price * (item.qty || 1)).toLocaleString()}`).join("\n");
          
          const textMessage = `*NEW MARKET ORDER - MAITAMA FARMERS MARKET*\n\n` +
            `*Customer Name:* ${buyerName}\n` +
            `*Phone Number:* ${buyerPhone}\n` +
            `*Abuja Delivery Address:* ${buyerAddress}\n\n` +
            `*ORDERED PRODUCE:*\n${itemsList}\n\n` +
            `*Total Amount:* ₦${totalAmount.toLocaleString()}\n` +
            `*Delivery Note:* Dispatch Bolt Rider (Fee paid to rider on delivery)\n\n` +
            `Please send payment bank details to confirm this order!`;

          const encodedMessage = encodeURIComponent(textMessage);
          const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
          
          window.open(whatsappUrl, "_blank");
        };

        return (
          <div className="max-w-4xl mx-auto p-4 md:p-6">
            {/* TOP HEADER WITH EMBEDDED HIGH-RES BADGE LOGO */}
            <header className="flex justify-between items-center bg-emerald-900 text-white p-3 md:p-4 rounded-xl shadow-md mb-6">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 md:w-16 md:h-16 flex-shrink-0 bg-white rounded-xl p-1 shadow-inner flex items-center justify-center">
                  <svg viewBox="0 0 200 200" className="w-full h-full">
                    <circle cx="100" cy="100" r="95" fill="#065f46" stroke="#fbbf24" strokeWidth="4" />
                    <circle cx="100" cy="100" r="85" fill="none" stroke="#047857" strokeWidth="2" strokeDasharray="4,4" />
                    <path d="M 30,130 Q 100,70 170,130 Z" fill="#15803d" />
                    <circle cx="100" cy="90" r="22" fill="#fbbf24" />
                    <path d="M 60,120 Q 100,100 140,120 L 130,150 Q 100,160 70,150 Z" fill="#d97706" />
                    <circle cx="85" cy="115" r="12" fill="#ef4444" />
                    <circle cx="115" cy="115" r="12" fill="#f97316" />
                    <path d="M 100,95 Q 80,105 100,118 Q 120,105 100,95 Z" fill="#10b981" />
                    <rect x="30" y="145" width="140" height="25" rx="6" fill="#022c22" stroke="#fbbf24" strokeWidth="1.5" />
                    <text x="100" y="162" fontFamily="Arial, sans-serif" fontSize="13" fontWeight="bold" fill="#ffffff" textAnchor="middle" letterSpacing="1">MAITAMA</text>
                  </svg>
                </div>

                <div>
                  <h1 className="text-base md:text-xl font-extrabold tracking-tight">Maitama Farmers Market Direct</h1>
                  <p className="text-emerald-200 text-[11px] md:text-xs">Fresh Abuja Produce & Fast Bolt Delivery</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {view === "store" && (
                  <button
                    onClick={scrollToCart}
                    className="relative bg-emerald-700 hover:bg-emerald-600 text-white p-2.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition"
                    title="View Basket"
                  >
                    🛒
                    <span className="bg-amber-400 text-emerald-950 px-1.5 py-0.5 rounded-full text-[10px] font-bold">
                      {totalCartItemsCount}
                    </span>
                  </button>
                )}

                {view === "store" ? (
                  <button
                    onClick={() => setView(isAuthenticated ? "admin_dashboard" : "admin_login")}
                    className="bg-emerald-950 hover:bg-black text-xs px-3 py-2.5 rounded-lg font-semibold transition flex items-center gap-1 border border-emerald-700"
                  >
                    🔒 <span className="hidden sm:inline">Vendor</span> Portal
                  </button>
                ) : (
                  <button
                    onClick={() => setView("store")}
                    className="bg-emerald-700 hover:bg-emerald-600 text-xs px-3 py-2 rounded-lg font-semibold transition"
                  >
                    ← Back
                  </button>
                )}
              </div>
            </header>

            {/* STOREFRONT */}
            {view === "store" && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="md:col-span-2 space-y-4">
                  <h2 className="text-lg font-bold text-slate-700">Available Produce ({products.length})</h2>
                  
                  {loading ? (
                    <div className="bg-white p-8 rounded-xl text-center text-slate-500">Loading market inventory...</div>
                  ) : products.length === 0 ? (
                    <div className="bg-white p-8 rounded-xl text-center text-slate-500">No produce added yet. Log into Vendor Portal to publish items.</div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {products.map((item) => (
                        <div key={item.id} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between">
                          <img src={item.image} alt={item.name} className="h-40 w-full object-cover" />
                          <div className="p-4 flex-1 flex flex-col justify-between">
                            <div>
                              <h3 className="font-bold text-slate-800 text-base">{item.name}</h3>
                              <p className="text-emerald-700 font-bold text-lg mt-1">₦{Number(item.price).toLocaleString()}</p>
                            </div>
                            <button
                              onClick={() => addToCart(item)}
                              className="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition"
                            >
                              Add to Selection
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* CART SECTION */}
                <div id="cart-section" className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 h-fit space-y-4">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h2 className="text-lg font-bold text-slate-700">Your Basket ({totalCartItemsCount})</h2>
                    <span className="text-xl">🛒</span>
                  </div>

                  {cart.length === 0 ? (
                    <p className="text-sm text-slate-400 py-4 text-center">Select items from market list to order.</p>
                  ) : (
                    <form onSubmit={handleSendWhatsAppOrder} className="space-y-3">
                      <div className="max-h-52 overflow-y-auto space-y-2 pr-1">
                        {cart.map((item) => (
                          <div key={item.id} className="flex justify-between items-center text-xs border-b pb-2">
                            <div className="flex-1 pr-1">
                              <span className="font-semibold text-slate-800 block truncate">{item.name}</span>
                              <span className="text-[10px] text-slate-500">₦{Number(item.price).toLocaleString()} each</span>
                            </div>

                            <div className="flex items-center space-x-1.5 bg-slate-100 rounded-md px-1.5 py-0.5">
                              <button
                                type="button"
                                onClick={() => updateQuantity(item.id, -1)}
                                className="text-slate-600 hover:text-red-600 font-bold px-1 text-xs"
                              >
                                -
                              </button>
                              <span className="font-bold text-slate-800 text-xs">{item.qty || 1}</span>
                              <button
                                type="button"
                                onClick={() => updateQuantity(item.id, 1)}
                                className="text-slate-600 hover:text-emerald-600 font-bold px-1 text-xs"
                              >
                                +
                              </button>
                            </div>

                            <div className="flex items-center gap-1.5 pl-2">
                              <span className="font-semibold text-slate-800">₦{(Number(item.price) * (item.qty || 1)).toLocaleString()}</span>
                              <button
                                type="button"
                                onClick={() => removeFromCart(item.id)}
                                className="text-red-400 hover:text-red-600 font-bold text-xs pl-1"
                              >
                                ✕
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>

                      <div className="border-t pt-2 flex justify-between font-bold text-slate-800 text-sm">
                        <span>Items Total:</span>
                        <span className="text-emerald-700">₦{totalAmount.toLocaleString()}</span>
                      </div>

                      <div className="space-y-2 border-t pt-3">
                        <label className="block text-xs font-semibold text-slate-600">Your Name</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Amina Bello"
                          value={buyerName}
                          onChange={(e) => setBuyerName(e.target.value)}
                          className="w-full p-2 border rounded-lg text-xs bg-slate-50"
                        />

                        <label className="block text-xs font-semibold text-slate-600">Phone Number</label>
                        <input
                          type="tel"
                          required
                          placeholder="e.g. 08012345678"
                          value={buyerPhone}
                          onChange={(e) => setBuyerPhone(e.target.value)}
                          className="w-full p-2 border rounded-lg text-xs bg-slate-50"
                        />

                        <label className="block text-xs font-semibold text-slate-600">Full Abuja Delivery Address</label>
                        <textarea
                          required
                          rows="2"
                          placeholder="e.g. Plot 14, Aminu Kano Crescent, Wuse 2"
                          value={buyerAddress}
                          onChange={(e) => setBuyerAddress(e.target.value)}
                          className="w-full p-2 border rounded-lg text-xs bg-slate-50"
                        ></textarea>

                        <p className="text-[11px] text-slate-500 italic">
                          * Delivery fee is calculated on Bolt and paid directly to rider.
                        </p>

                        <button
                          type="submit"
                          className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-sm transition mt-2 flex items-center justify-center gap-2"
                        >
                          💬 Send Order to WhatsApp & Pay
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}

            {/* LOGIN PORTAL */}
            {view === "admin_login" && (
              <div className="max-w-md mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200 mt-8">
                <h2 className="text-xl font-bold text-slate-800 mb-1">Protected Vendor Portal</h2>
                <p className="text-xs text-slate-500 mb-4">Enter vendor credentials to populate and edit market produce.</p>
                
                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Username</label>
                    <input
                      type="text"
                      required
                      placeholder="Enter username"
                      value={inputUsername}
                      onChange={(e) => setInputUsername(e.target.value)}
                      className="w-full p-2 border rounded-lg text-sm bg-slate-50"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <input
                      type="password"
                      required
                      placeholder="Enter password"
                      value={inputPassword}
                      onChange={(e) => setInputPassword(e.target.value)}
                      className="w-full p-2 border rounded-lg text-sm bg-slate-50"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2 rounded-lg text-sm transition"
                  >
                    Log In to Dashboard
                  </button>
                </form>
              </div>
            )}

            {/* DASHBOARD */}
            {view === "admin_dashboard" && (
              <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
                <div className="flex justify-between items-center border-b pb-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-800">Vendor Management Dashboard</h2>
                    <p className="text-xs text-slate-500">Add produce, upload photos, and update portal login credentials</p>
                  </div>
                  <button
                    onClick={() => {
                      setIsAuthenticated(false);
                      setView("store");
                    }}
                    className="text-xs text-red-600 font-semibold hover:underline"
                  >
                    Log Out
                  </button>
                </div>

                {/* UPDATE LOGIN CREDENTIALS FORM */}
                <form onSubmit={handleUpdateCredentials} className="space-y-4 bg-amber-50/60 p-4 rounded-xl border border-amber-200">
                  <h3 className="text-sm font-bold text-slate-800">🔑 Update Portal Login Credentials</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">New Username</label>
                      <input
                        type="text"
                        required
                        placeholder={`Current: ${adminUsername}`}
                        value={newUsernameInput}
                        onChange={(e) => setNewUsernameInput(e.target.value)}
                        className="w-full p-2 border rounded-lg text-xs bg-white"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">New Password</label>
                      <input
                        type="password"
                        required
                        placeholder="Enter new password"
                        value={newPasswordInput}
                        onChange={(e) => setNewPasswordInput(e.target.value)}
                        className="w-full p-2 border rounded-lg text-xs bg-white"
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-2 rounded-lg text-xs transition"
                  >
                    Save New Credentials
                  </button>
                </form>

                {/* Add New Item Form */}
                <form onSubmit={handleAddProduct} className="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <h3 className="text-sm font-bold text-slate-700">+ Add New Produce Item (Global Live Sync)</h3>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Produce Name</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Fresh Habanero Peppers (Rodo)"
                        value={newItemName}
                        onChange={(e) => setNewItemName(e.target.value)}
                        className="w-full p-2 border rounded-lg text-xs bg-white"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Price in Naira (₦)</label>
                      <input
                        type="number"
                        required
                        placeholder="e.g. 2500"
                        value={newItemPrice}
                        onChange={(e) => setNewItemPrice(e.target.value)}
                        className="w-full p-2 border rounded-lg text-xs bg-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Upload Photo from Phone/Computer</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={handleImageUpload}
                      className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-100 file:text-emerald-700 hover:file:bg-emerald-200 cursor-pointer"
                    />
                  </div>

                  {newItemImage && (
                    <div className="mt-2">
                      <p className="text-[11px] font-semibold text-slate-500 mb-1">Photo Preview:</p>
                      <img src={newItemImage} alt="Preview" className="h-24 w-24 object-cover rounded-lg border" />
                    </div>
                  )}

                  <button
                    type="submit"
                    className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-lg text-xs transition"
                  >
                    Publish Item Live Globally
                  </button>
                </form>

                {/* Live Inventory List */}
                <div>
                  <h3 className="text-sm font-bold text-slate-700 mb-3">Live Cloud Produce ({products.length})</h3>
                  <div className="space-y-2">
                    {products.map((item) => (
                      <div key={item.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-lg border text-xs">
                        <div className="flex items-center gap-3">
                          <img src={item.image} alt="" className="w-10 h-10 object-cover rounded" />
                          <div>
                            <p className="font-bold text-slate-700">{item.name}</p>
                            <p className="text-emerald-700 font-bold">₦{Number(item.price).toLocaleString()}</p>
                          </div>
                        </div>
                        <button
                          onClick={() => handleDeleteProduct(item.id)}
                          className="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded font-semibold text-xs"
                        >
                          Delete
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
