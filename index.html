<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maitama Farmers Market Direct</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        // SET YOUR WHATSAPP PHONE NUMBER HERE (International format without '+' sign, e.g., 2348012345678)
        const WHATSAPP_NUMBER = "2348000000000";

        const [view, setView] = useState("store"); 
        const [adminPassword, setAdminPassword] = useState("");
        const [isAuthenticated, setIsAuthenticated] = useState(false);

        // Inventory list
        const [products, setProducts] = useState([
          {
            id: 1,
            name: "Fresh Organic Tomatoes (Basket)",
            price: 8500,
            image: "https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=500&auto=format&fit=crop&q=60"
          },
          {
            id: 2,
            name: "Exotic Passion Fruit (1kg)",
            price: 4200,
            image: "https://images.unsplash.com/photo-1528825871115-3581a5387919?w=500&auto=format&fit=crop&q=60"
          },
          {
            id: 3,
            name: "Fluted Pumpkin Greens / Ugu (Bundle)",
            price: 1500,
            image: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500&auto=format&fit=crop&q=60"
          }
        ]);

        // New item form
        const [newItemName, setNewItemName] = useState("");
        const [newItemPrice, setNewItemPrice] = useState("");
        const [newItemImage, setNewItemImage] = useState("");

        // Cart & Checkout form
        const [cart, setCart] = useState([]);
        const [buyerName, setBuyerName] = useState("");
        const [buyerPhone, setBuyerPhone] = useState("");
        const [buyerAddress, setBuyerAddress] = useState("");

        const handleAddProduct = (e) => {
          e.preventDefault();
          if (!newItemName || !newItemPrice) return;
          
          const newEntry = {
            id: Date.now(),
            name: newItemName,
            price: parseFloat(newItemPrice),
            image: newItemImage || "https://images.unsplash.com/photo-1610348725531-843dff563e2c?w=500&auto=format&fit=crop&q=60"
          };

          setProducts([...products, newEntry]);
          setNewItemName("");
          setNewItemPrice("");
          setNewItemImage("");
          alert("Produce item published to market!");
        };

        const addToCart = (product) => {
          setCart([...cart, product]);
        };

        const removeFromCart = (index) => {
          const updated = [...cart];
          updated.splice(index, 1);
          setCart(updated);
        };

        const totalAmount = cart.reduce((sum, item) => sum + item.price, 0);

        const handleAdminLogin = (e) => {
          e.preventDefault();
          if (adminPassword === "admin" || adminPassword === "maitama2026") {
            setIsAuthenticated(true);
            setView("admin_dashboard");
          } else {
            alert("Incorrect password!");
          }
        };

        const handleSendWhatsAppOrder = (e) => {
          e.preventDefault();
          if (!buyerName || !buyerPhone || !buyerAddress) {
            alert("Please complete all details!");
            return;
          }

          // Build formatted WhatsApp message
          const itemsList = cart.map((item, i) => `${i + 1}. ${item.name} - NGN ${item.price.toLocaleString()}`).join("\n");
          
          const textMessage = `*NEW MARKET ORDER - MAITAMA FARMERS MARKET*\n\n` +
            `*Customer Name:* ${buyerName}\n` +
            `*Phone:* ${buyerPhone}\n` +
            `*Delivery Address:* ${buyerAddress}\n\n` +
            `*SELECTED PRODUCE:*\n${itemsList}\n\n` +
            `*Total Amount:* NGN ${totalAmount.toLocaleString()}\n` +
            `*Delivery Method:* Dispatch Bolt Rider (Customer pays rider fee on delivery)\n\n` +
            `Please confirm bank details for transfer!`;

          const encodedMessage = encodeURIComponent(textMessage);
          const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
          
          window.open(whatsappUrl, "_blank");
        };

        return (
          <div className="max-w-4xl mx-auto p-4 md:p-6">
            <header className="flex justify-between items-center bg-emerald-800 text-white p-4 rounded-xl shadow-md mb-6">
              <div>
                <h1 className="text-xl md:text-2xl font-bold">Maitama Farmers Market Direct</h1>
                <p className="text-emerald-200 text-xs">Fresh Abuja Produce & Direct Delivery</p>
              </div>
              <div>
                {view === "store" ? (
                  <button
                    onClick={() => setView(isAuthenticated ? "admin_dashboard" : "admin_login")}
                    className="bg-emerald-900 hover:bg-emerald-950 text-xs px-3 py-2 rounded-lg font-semibold transition"
                  >
                    Vendor Portal
                  </button>
                ) : (
                  <button
                    onClick={() => setView("store")}
                    className="bg-emerald-700 hover:bg-emerald-600 text-xs px-3 py-2 rounded-lg font-semibold transition"
                  >
                    ← Back to Store
                  </button>
                )}
              </div>
            </header>

            {view === "store" && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="md:col-span-2 space-y-4">
                  <h2 className="text-lg font-bold text-slate-700">Available Produce</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {products.map((item) => (
                      <div key={item.id} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between">
                        <img src={item.image} alt={item.name} className="h-40 w-full object-cover" />
                        <div className="p-4 flex-1 flex flex-col justify-between">
                          <div>
                            <h3 className="font-bold text-slate-800 text-base">{item.name}</h3>
                            <p className="text-emerald-700 font-bold text-lg mt-1">₦{item.price.toLocaleString()}</p>
                          </div>
                          <button
                            onClick={() => addToCart(item)}
                            className="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition"
                          >
                            Add to Selection
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 h-fit space-y-4">
                  <h2 className="text-lg font-bold text-slate-700 border-b pb-2">Your Basket ({cart.length})</h2>

                  {cart.length === 0 ? (
                    <p className="text-sm text-slate-400 py-4 text-center">Select items to place an order.</p>
                  ) : (
                    <form onSubmit={handleSendWhatsAppOrder} className="space-y-3">
                      <div className="max-h-36 overflow-y-auto space-y-2 pr-1">
                        {cart.map((item, index) => (
                          <div key={index} className="flex justify-between items-center text-xs border-b pb-1">
                            <span className="truncate pr-2">{item.name}</span>
                            <div className="flex items-center gap-2">
                              <span className="font-semibold">₦{item.price.toLocaleString()}</span>
                              <button
                                type="button"
                                onClick={() => removeFromCart(index)}
                                className="text-red-500 font-bold"
                              >
                                ×
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>

                      <div className="border-t pt-2 flex justify-between font-bold text-slate-800 text-sm">
                        <span>Produce Total:</span>
                        <span className="text-emerald-700">₦{totalAmount.toLocaleString()}</span>
                      </div>

                      <div className="space-y-2 border-t pt-3">
                        <label className="block text-xs font-semibold text-slate-600">Your Full Name</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Amina Bello"
                          value={buyerName}
                          onChange={(e) => setBuyerName(e.target.value)}
                          className="w-full p-2 border rounded-lg text-xs bg-slate-50"
                        />

                        <label className="block text-xs font-semibold text-slate-600">Phone Number</label>
                        <input
                          type="tel"
                          required
                          placeholder="e.g. 08012345678"
                          value={buyerPhone}
                          onChange={(e) => setBuyerPhone(e.target.value)}
                          className="w-full p-2 border rounded-lg text-xs bg-slate-50"
                        />

                        <label className="block text-xs font-semibold text-slate-600">Full Abuja Delivery Address</label>
                        <textarea
                          required
                          rows="2"
                          placeholder="e.g. Plot 14, Aminu Kano Crescent, Wuse 2"
                          value={buyerAddress}
                          onChange={(e) => setBuyerAddress(e.target.value)}
                          className="w-full p-2 border rounded-lg text-xs bg-slate-50"
                        ></textarea>

                        <p className="text-[11px] text-slate-500 italic">
                          * Delivery fee is calculated on Bolt and paid to rider on delivery.
                        </p>

                        <button
                          type="submit"
                          className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-sm transition mt-2 flex items-center justify-center gap-2"
                        >
                          💬 Send Order to WhatsApp & Pay
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}

            {view === "admin_login" && (
              <div className="max-w-md mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200 mt-8">
                <h2 className="text-xl font-bold text-slate-800 mb-2">Vendor Portal</h2>
                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <input
                      type="password"
                      placeholder="Enter password (default: admin)"
                      value={adminPassword}
                      onChange={(e) => setAdminPassword(e.target.value)}
                      className="w-full p-2 border rounded-lg text-sm bg-slate-50"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2 rounded-lg text-sm"
                  >
                    Log In
                  </button>
                </form>
              </div>
            )}

            {view === "admin_dashboard" && (
              <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
                <div className="flex justify-between items-center border-b pb-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-800">Vendor Management Portal</h2>
                    <p className="text-xs text-slate-500">List new fresh produce for buyers</p>
                  </div>
                  <button
                    onClick={() => {
                      setIsAuthenticated(false);
                      setView("store");
                    }}
                    className="text-xs text-red-600 font-semibold hover:underline"
                  >
                    Log Out
                  </button>
                </div>

                <form onSubmit={handleAddProduct} className="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <h3 className="text-sm font-bold text-slate-700">List New Produce Item</h3>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Produce Name</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Fresh Habanero Peppers (Rodo)"
                        value={newItemName}
                        onChange={(e) => setNewItemName(e.target.value)}
                        className="w-full p-2 border rounded-lg text-xs bg-white"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Price (₦)</label>
                      <input
                        type="number"
                        required
                        placeholder="e.g. 2500"
                        value={newItemPrice}
                        onChange={(e) => setNewItemPrice(e.target.value)}
                        className="w-full p-2 border rounded-lg text-xs bg-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Photo URL (Optional)</label>
                    <input
                      type="url"
                      placeholder="e.g. https://images.unsplash.com/photo-..."
                      value={newItemImage}
                      onChange={(e) => setNewItemImage(e.target.value)}
                      className="w-full p-2 border rounded-lg text-xs bg-white"
                    />
                  </div>

                  <button
                    type="submit"
                    className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-lg text-xs"
                  >
                    + Publish Item to Market
                  </button>
                </form>

                <div>
                  <h3 className="text-sm font-bold text-slate-700 mb-3">Live Produce Items ({products.length})</h3>
                  <div className="space-y-2">
                    {products.map((item) => (
                      <div key={item.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-lg border text-xs">
                        <div className="flex items-center gap-3">
                          <img src={item.image} alt="" className="w-10 h-10 object-cover rounded" />
                          <span className="font-bold text-slate-700">{item.name}</span>
                        </div>
                        <span className="font-bold text-emerald-700">₦{item.price.toLocaleString()}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
